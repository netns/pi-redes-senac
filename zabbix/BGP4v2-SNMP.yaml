zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 43e8d7897056466d965a0d8b5c916723
      name: 'Templates/Network Devices'
    - uuid: 0f6d0ad2dc904295808603733d0ef773
      name: Templates/Protocols
  templates:
    - uuid: c0963bf36c2542a6b346e638bf8f0094
      template: 'BGP4v2 Extension by SNMP'
      name: 'BGP4v2 Extension by SNMP'
      description: |
        Developed by Daniel Lima <contato.dlima@protonmail.com>
        
        MIBs used:
        
        BGP4V2-MIB
        
        Note:
        This template is based on the BGP4V2-MIB. The monitored device may not implement or expose all objects defined by the MIB, depending on the vendor and software version. As a result, some items or discovery rules may not be supported on certain devices.
      groups:
        - name: 'Templates/Network Devices'
        - name: Templates/Protocols
      items:
        - uuid: 87d1080fe5044dba86bb0d265b806b68
          name: 'BGP Peer Walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.3.5.1.1.2.1, 1.3.6.1.3.5.1.1.4.1,1.3.6.1.3.5.1.1.5.1, 1.3.6.1.3.5.1.1.6.1, 1.3.6.1.3.5.1.1.7.1]'
          key: bgp.peer.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          tags:
            - tag: component
              value: network
            - tag: protocol
              value: bgp
      discovery_rules:
        - uuid: a21505c3177d422a87a888e7a3dcf601
          name: 'BGP Peer Discovery'
          type: DEPENDENT
          key: bgp.peer.discovery
          delay: '0'
          item_prototypes:
            - uuid: acef78c4816b46dabff86248f39cc9e3
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): Admin Status'
              type: DEPENDENT
              key: 'bgp.peer.adminstatus[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: '0'
              valuemap:
                name: 'BGP Peer Admin Status'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.2.1.12.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
              trigger_prototypes:
                - uuid: 54b163e5d956458489ede2e8d7c681b4
                  expression: 'last(/BGP4v2 Extension by SNMP/bgp.peer.adminstatus[{#SNMPINDEX}])=1'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/BGP4v2 Extension by SNMP/bgp.peer.adminstatus[{#SNMPINDEX}])=2'
                  name: 'BGP Peer AS {#REMOTEASN} ({#PEERDESC}): Administratively down'
                  opdata: 'Admin status: {ITEM.LASTVALUE}'
                  url_name: 'BGP Peer'
                  priority: INFO
                  description: |
                    The BGP peer AS {#REMOTEASN} ({#REMOTEADDRESS}) is administratively disabled.
                    
                    This condition may be intentional. Verify the peer configuration and maintenance status before taking corrective action.
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: bgp_peer
                    - tag: peer_as
                      value: '{#REMOTEAS}'
                    - tag: peer_name
                      value: '{#PEERDESC}'
                    - tag: protocol
                      value: bgp
            - uuid: a991388fe43d40c2a4cbdfb979528960
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): Session Established Time'
              type: DEPENDENT
              key: 'bgp.peer.established.time[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: 90d
              units: s
              description: 'This timer indicates how long (in seconds) this peer has been in the established state or how long since this peer was last in the established state. It is set to zero when a new peer is configured or when the router is booted.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.4.1.1.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
            - uuid: 9ec852f5e058433cbc61d3193d27a0da
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): Established Transitions'
              type: DEPENDENT
              key: 'bgp.peer.established.transitions[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: 90d
              description: 'The total number of times the BGP FSM transitioned into the established state for this peer.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.7.1.5.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
              trigger_prototypes:
                - uuid: cce0fd72b2d042c8ac8d4efdb9155631
                  expression: 'change(/BGP4v2 Extension by SNMP/bgp.peer.established.transitions[{#SNMPINDEX}])>0'
                  recovery_mode: NONE
                  name: 'BGP Peer AS {#REMOTEASN} ({#PEERDESC}): Established state transition detected'
                  opdata: 'Established transitions: {ITEM.LASTVALUE}'
                  url_name: 'BGP Peer'
                  status: DISABLED
                  discover: NO_DISCOVER
                  priority: INFO
                  description: |
                    A new BGP Established state transition was detected for peer AS {#REMOTEASN} ({#REMOTEADDRESS}).
                    
                    Use the peer state, established time and message/update counters to investigate possible session instability.
                  type: MULTIPLE
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: bgp_peer
                    - tag: event_type
                      value: bgp_transition
                    - tag: peer_as
                      value: '{#REMOTEAS}'
                    - tag: peer_name
                      value: '{#PEERDESC}'
                    - tag: protocol
                      value: bgp
                - uuid: b12e0ec2843045bc919199c97613fb91
                  expression: 'changecount(/BGP4v2 Extension by SNMP/bgp.peer.established.transitions[{#SNMPINDEX}],15m,"inc")>={$BGP.FLAP.THRESHOLD}'
                  name: 'BGP Peer AS {#REMOTEASN} ({#PEERDESC}): Session flapping detected'
                  opdata: 'Established transitions: {ITEM.LASTVALUE}'
                  url_name: 'BGP Peer'
                  priority: HIGH
                  description: |
                    The BGP peer AS {#REMOTEASN} ({#REMOTEADDRESS}) is showing repeated Established state transitions.
                    
                    Investigate the underlying transport connectivity, BGP timers, authentication, routing, interface errors and remote peer status.
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: bgp_peer
                    - tag: event_type
                      value: bgp_flapping
                    - tag: peer_as
                      value: '{#REMOTEAS}'
                    - tag: peer_name
                      value: '{#PEERDESC}'
                    - tag: protocol
                      value: bgp
            - uuid: 6f1eb54205724e0a83edd92dc17e0fb6
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): Hold Time'
              type: DEPENDENT
              key: 'bgp.peer.holdtime[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: '0'
              units: s
              description: |
                Time interval (in seconds) for the Hold Timer established with the peer.  The
                value of this object is calculated by this BGP speaker, using the smaller of the values in bgpPeerHoldTimeConfigured and the Hold Time received in the OPEN message.
                              
                This value must be at least three seconds if it is not zero (0).
                              
                If the Hold Timer has not been established with the peer this object MUST have a value of zero (0).
                              
                If the bgpPeerHoldTimeConfigured object has a value of (0), then this object MUST have a value of (0).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.6.1.1.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
            - uuid: 7e049a7de06d4b22b7a9e468acd15c71
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): Identifier'
              type: DEPENDENT
              key: 'bgp.peer.id[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.2.1.11.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
            - uuid: b281210f4ce942f787bf6562b37ca7dd
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): In Total Messages'
              type: DEPENDENT
              key: 'bgp.peer.in.messages[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: 90d
              description: 'The total number of messages received from the remote peer on this connection.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.7.1.3.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
            - uuid: 8f43add2d6734cebbb9fafd10991f36d
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): In Updates'
              type: DEPENDENT
              key: 'bgp.peer.in.updates[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: 90d
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.7.1.1.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
            - uuid: 8fb52aada11044c78e796050b74fe34e
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): KeepAlive'
              type: DEPENDENT
              key: 'bgp.peer.keepalive[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: '0'
              units: s
              description: |
                Time interval (in seconds) for the KeepAlive timer established with the peer. The value of this object is calculated by this BGP speaker such that, when compared with bgpPeerHoldTime, it has the same proportion that bgpPeerKeepAliveConfigured has, compared with bgpPeerHoldTimeConfigured.
                              
                If the KeepAlive timer has not been established with the peer, this object MUST have a value of zero (0).
                              
                If the of bgpPeerKeepAliveConfigured object has a value of (0), then this object MUST have a value of (0).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.6.1.2.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
            - uuid: ceccf71431e7480faba8747ce5e85770
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): Out Total Messages'
              type: DEPENDENT
              key: 'bgp.peer.out.messages[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: 90d
              description: 'The total number of messages transmitted to the remote peer on this connection.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.7.1.4.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
            - uuid: 2dddceb4ea504785aaaa8cd657add02f
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): Out Updates'
              type: DEPENDENT
              key: 'bgp.peer.out.updates[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: 90d
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.7.1.2.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
            - uuid: ce00792a40454d30bfc0a0f8bba61a6e
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): State'
              type: DEPENDENT
              key: 'bgp.peer.state[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: '0'
              valuemap:
                name: 'BGP Peer States'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.2.1.13.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
            - uuid: c8f0b72e9ca24fb4941476813f17aa3f
              name: 'Peer AS {#REMOTEASN} ({#PEERDESC}): In Update Elapsed Time'
              type: DEPENDENT
              key: 'bgp.peer.update.elapsed.time[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: 90d
              units: s
              description: 'Elapsed time (in seconds) since the last BGP UPDATE message was received from the peer. Each time bgpPeerInUpdates is incremented, the value of this object is set to zero (0).'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.3.5.1.1.4.1.1.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: bgp.peer.walk
              tags:
                - tag: component
                  value: network
                - tag: peer
                  value: '{#REMOTEASN}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
          trigger_prototypes:
            - uuid: 0d362ec6e7c84531b474b3267eb8b0ff
              expression: |
                last(/BGP4v2 Extension by SNMP/bgp.peer.state[{#SNMPINDEX}])<>6
                and
                last(/BGP4v2 Extension by SNMP/bgp.peer.adminstatus[{#SNMPINDEX}])=2
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                last(/BGP4v2 Extension by SNMP/bgp.peer.state[{#SNMPINDEX}])=6
                and
                last(/BGP4v2 Extension by SNMP/bgp.peer.adminstatus[{#SNMPINDEX}])=2
              name: 'BGP peer AS {#REMOTEASN} ({#PEERDESC}) is not established'
              opdata: 'State {ITEM.LASTVALUE}'
              url_name: 'BGP Peer'
              priority: HIGH
              description: |
                The BGP session with peer AS {#REMOTEASN} ({#REMOTEADDRESS}) is not in Established state.
                
                The peer is administratively enabled, but the BGP session is currently not established.
                
                Check the BGP state, TCP connectivity, routing to the peer, authentication parameters, timers and remote peer status.
              dependencies:
                - name: 'BGP Peer AS {#REMOTEASN} ({#PEERDESC}): Administratively down'
                  expression: 'last(/BGP4v2 Extension by SNMP/bgp.peer.adminstatus[{#SNMPINDEX}])=1'
                  recovery_expression: 'last(/BGP4v2 Extension by SNMP/bgp.peer.adminstatus[{#SNMPINDEX}])=2'
              tags:
                - tag: component
                  value: bgp_peer
                - tag: peer_as
                  value: '{#REMOTEAS}'
                - tag: peer_name
                  value: '{#PEERDESC}'
                - tag: protocol
                  value: bgp
          master_item:
            key: bgp.peer.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#REMOTEADDRESS}'
                - 1.3.6.1.3.5.1.1.2.1.5
                - '0'
                - '{#REMOTEASN}'
                - 1.3.6.1.3.5.1.1.2.1.10
                - '0'
                - '{#PEERDESC}'
                - 1.3.6.1.3.5.1.1.2.1.14
                - '1'
      tags:
        - tag: component
          value: network
        - tag: protocol
          value: bgp
      macros:
        - macro: '{$BGP.FLAP.THRESHOLD}'
          value: '5'
      valuemaps:
        - uuid: 16f57d6c05604ab6ae8aa4004503ea5a
          name: 'BGP Peer Admin Status'
          mappings:
            - value: '1'
              newvalue: stop
            - value: '2'
              newvalue: start
        - uuid: da2e372a0842434fbf1b067b9c44c101
          name: 'BGP Peer States'
          mappings:
            - value: '1'
              newvalue: idle
            - value: '2'
              newvalue: connect
            - value: '3'
              newvalue: active
            - value: '4'
              newvalue: opensent
            - value: '5'
              newvalue: openconfirm
            - value: '6'
              newvalue: established
